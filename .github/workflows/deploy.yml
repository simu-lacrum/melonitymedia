name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /opt/melonitymedia

            echo "══════ Pulling latest changes ══════"
            git pull origin main

            echo "══════ Fixing .env ══════"
            sed -i 's|NEXT_PUBLIC_API_URL=https://cluster-cheats.shop/api|NEXT_PUBLIC_API_URL=https://melonitymedia.site|' .env
            sed -i 's|NEXT_PUBLIC_API_URL=https://cluster-cheats.shop|NEXT_PUBLIC_API_URL=https://melonitymedia.site|' .env
            sed -i 's|CORS_ORIGIN=https://cluster-cheats.shop|CORS_ORIGIN=https://melonitymedia.site|' .env

            # Fix Redis auth: REDIS_URL must include the password
            # Docker-compose uses REDIS_PASSWORD env var (default: changeme_redis)
            REDIS_PASS=$(grep '^REDIS_PASSWORD=' .env | cut -d= -f2 || echo "changeme_redis")
            if [ -z "$REDIS_PASS" ]; then REDIS_PASS="changeme_redis"; fi
            # Replace REDIS_URL without password → with password
            sed -i "s|REDIS_URL=redis://redis:6379|REDIS_URL=redis://:${REDIS_PASS}@redis:6379|" .env
            sed -i "s|REDIS_URL=redis://localhost:6379|REDIS_URL=redis://:${REDIS_PASS}@redis:6379|" .env
            # Add REDIS_PASSWORD if missing
            grep -q '^REDIS_PASSWORD=' .env || echo "REDIS_PASSWORD=${REDIS_PASS}" >> .env
            echo "  Redis connection settings updated"

            echo "Building replacement images while current containers stay available"
            docker compose up -d db redis
            docker compose build api worker web
            docker compose up -d --no-deps api web

            ACTIVE_JOBS=0
            for ATTEMPT in $(seq 1 30); do
              ACTIVE_JOBS=0
              for QUEUE in upload warmup cookies edit-profile login analytics-cron shadowban-check cleanup; do
                COUNT=$(docker compose exec -T redis redis-cli -a "${REDIS_PASS}" --no-auth-warning LLEN "bull:${QUEUE}:active" | tr -d '\r')
                ACTIVE_JOBS=$((ACTIVE_JOBS + COUNT))
              done
              if [ "$ACTIVE_JOBS" -eq 0 ]; then break; fi
              echo "${ACTIVE_JOBS} active job(s); waiting 20s before worker update"
              sleep 20
            done

            if [ "$ACTIVE_JOBS" -ne 0 ]; then
              echo "Worker update deferred: ${ACTIVE_JOBS} job(s) are still active. Existing work was not interrupted."
              exit 1
            fi

            # SIGTERM + stop_grace_period lets a race-window job finish safely.
            docker compose stop worker
            docker compose up -d --no-deps worker
            docker compose up -d --remove-orphans

            echo "══════ Ensuring infrastructure is running ══════"
            docker compose up -d db redis

            echo "══════ Waiting 30s for containers to start ══════"
            sleep 30

            echo "══════ Restarting nginx (pick up new container IPs) ══════"
            docker compose restart nginx

            echo "══════ Container status ══════"
            docker compose ps

            echo "══════ API logs (last 30 lines) ══════"
            docker compose logs api --tail=30 --no-color 2>&1 || true

            echo "══════ Worker logs (last 50 lines) ══════"
            docker compose logs worker --tail=50 --no-color 2>&1 || true

            echo "══════ Deploy complete ══════"
            docker image prune -f 2>/dev/null || true
